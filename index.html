<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BSI School Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f0ede6;color:#1a1a1a}

/* HEADER */
.hdr{background:#0a2a2a;height:48px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-logo{font-family:'DM Mono',monospace;color:#5dcaa5;font-size:12px;letter-spacing:.08em}
.hdr-back{display:none;background:transparent;border:.5px solid #2a5a4a;color:#5dcaa5;padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif}
.hdr-back:hover{background:#1a3a2a}

/* INDEX */
.idx-hero{padding:28px 20px 16px;text-align:center}
.idx-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#1d9e75;margin-bottom:8px}
.idx-title{font-size:22px;font-weight:500;color:#0a2a2a;margin-bottom:6px}
.idx-sub{font-size:13px;color:#666;max-width:560px;margin:0 auto;line-height:1.5}

.s-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding:16px 20px 48px;max-width:1020px;margin:0 auto}

.s-card{background:#fff;border-radius:14px;border:.5px solid #e0ddd8;overflow:hidden;display:flex;flex-direction:column}
.s-card-top{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between}
.s-phase-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:5px}
.s-name{font-size:15px;font-weight:500;color:#0a2a2a}
.s-desc{font-size:11px;color:#888;margin-top:2px;font-family:'DM Mono',monospace}
.s-iso{flex-shrink:0;margin-left:8px}

.s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px 12px}
.s-stat{background:#f7f5f0;border-radius:6px;padding:8px}
.s-stat-lbl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:2px}
.s-stat-val{font-size:14px;font-weight:500;color:#0a2a2a}

.s-qr{padding:10px 16px;border-top:.5px solid #f0ede6;display:flex;align-items:center;gap:12px}
.s-qr-info{flex:1}
.s-qr-lbl{font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:2px}
.s-qr-url{font-size:10px;color:#1d9e75;word-break:break-all;line-height:1.3}

.s-btn{margin:0 16px 16px;padding:10px;background:#0a2a2a;color:#5dcaa5;border:none;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;transition:background .15s}
.s-btn:hover{background:#163a2a}

/* DEMO */
.demo-wrap{display:flex;height:calc(100vh - 48px);overflow:hidden}
.plan-col{flex:1;display:flex;flex-direction:column;min-width:0}
.demo-bar{padding:10px 16px;background:#fff;border-bottom:.5px solid #e8e5de;flex-shrink:0}
.demo-bar-name{font-size:14px;font-weight:500;color:#0a2a2a}
.demo-bar-sub{font-size:11px;color:#888;font-family:'DM Mono',monospace;margin-top:1px}

.el-chips{padding:8px 14px;background:#fff;border-bottom:.5px solid #e8e5de;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.el-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:.5px solid #ddd;font-size:11px;cursor:pointer;background:#f8f5f0;color:#555;font-family:'DM Sans',sans-serif;transition:all .12s}
.el-chip:hover{border-color:#1d9e75;color:#0f6e56}
.el-chip.on{border-color:#1d9e75;background:#e1f5ee;color:#0f6e56;font-weight:500}
.el-chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.plan-canvas{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;background:#f0ede6}
.plan-canvas svg{max-width:100%;height:auto;display:block}

/* PROPS PANEL */
.props-col{width:280px;background:#fff;border-left:.5px solid #e0ddd8;display:flex;flex-direction:column;flex-shrink:0}
.pr-hdr{padding:14px 16px;border-bottom:.5px solid #f0ede6;flex-shrink:0}
.pr-hdr-tag{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-bottom:4px}
.pr-hdr-name{font-size:15px;font-weight:500;color:#0a2a2a;line-height:1.2}

.pr-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#bbb;font-size:13px;gap:12px;line-height:1.5}

.pr-body{flex:1;overflow-y:auto;padding:14px 16px}
.pr-row{margin-bottom:13px;padding-bottom:13px;border-bottom:.5px solid #f5f2ec}
.pr-row:last-child{border-bottom:none;margin-bottom:0}
.pr-lbl{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin-bottom:3px}
.pr-val{font-size:13px;font-weight:500;color:#0a2a2a;line-height:1.3}
.pr-sub{font-size:11px;color:#888;margin-top:2px;line-height:1.4}

.cbadge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:500;font-family:'DM Mono',monospace}
.ca{background:#e8f5de;color:#276010}.cb{background:#eaf3de;color:#3b6d11}
.cc{background:#faeeda;color:#633806}.cd{background:#faece7;color:#4a1b0c}.ce{background:#fcebeb;color:#501313}

.act-box{border-radius:6px;padding:9px 10px;font-size:12px;line-height:1.45;margin-top:4px}
.act-ok{background:#eaf3de;border-left:3px solid #97c459;color:#173404}
.act-warn{background:#faeeda;border-left:3px solid #ef9f27;color:#412402}
.act-urgent{background:#faece7;border-left:3px solid #d85a30;color:#4a1b0c}

.pr-cta{padding:14px 16px;background:#0a2a2a;border-top:.5px solid #1a3a2a;flex-shrink:0}
.pr-cta-txt{font-size:11px;color:#5dcaa5;font-family:'DM Mono',monospace;margin-bottom:8px;line-height:1.4}
.pr-cta-btn{display:block;background:#1d9e75;color:#fff;border:none;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;font-weight:500;text-align:center}
.pr-cta-btn:hover{background:#0f6e56}

.fp-win{cursor:pointer}.fp-hit{cursor:pointer}.fp-sym{cursor:pointer}.fp-iw{cursor:pointer}

@media(max-width:680px){
  .demo-wrap{flex-direction:column;height:auto;overflow:visible}
  .props-col{width:100%;border-left:none;border-top:.5px solid #e0ddd8;max-height:400px}
  .plan-col{height:55vh}
}
</style>
</head>

const ELEMENTS = [

// ── ELEMENT PROPERTY DATA ─────────────────────────────────────────

// ── ISOMETRIC BUILDING SVG ───────────────────────────────────────
function isoSVG(cfg) {
  const {w,d,floors,col,shade,roof} = cfg;
  const s=10, COS=Math.sqrt(3)/2, SIN=0.5, OX=95, OY=90;

  function iso(x,y,z){return[(OX+(x-y)*COS*s).toFixed(1),(OY+(x+y)*SIN*s-z*s*1.5).toFixed(1)]}
  function pp(x,y,z){const[a,b]=iso(x,y,z);return a+','+b}
  function poly(pts,fill,stroke='#ffffff88',sw=0.7){return`<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`}

  let out='';
  for(let f=0;f<floors;f++){
    const z0=f*2,z1=z0+2;
    out+=poly(`${pp(0,d,z0)} ${pp(w,d,z0)} ${pp(w,d,z1)} ${pp(0,d,z1)}`,col);
    out+=poly(`${pp(w,d,z0)} ${pp(w,0,z0)} ${pp(w,0,z1)} ${pp(w,d,z1)}`,shade);
    if(f>0) out+=`<line x1="${iso(0,d,z0)[0]}" y1="${iso(0,d,z0)[1]}" x2="${iso(w,d,z0)[0]}" y2="${iso(w,d,z0)[1]}" stroke="#fff5" stroke-width="0.6"/>`;
    // Windows — front face
    for(let i=0;i<Math.floor(w);i++){
      if(i===0&&f===0){out+=poly(`${pp(i+.15,d,z0)} ${pp(i+.55,d,z0)} ${pp(i+.55,d,z0+1.2)} ${pp(i+.15,d,z0+1.2)}`,'#7a4a2088');continue;}
      const wz=z0+.6;
      out+=poly(`${pp(i+.15,d,wz)} ${pp(i+.65,d,wz)} ${pp(i+.65,d,wz+.75)} ${pp(i+.15,d,wz+.75)}`,'#b8d8f0cc');
    }
    // Windows — right face
    for(let i=0;i<Math.floor(d)-1;i++){
      const wz=z0+.6;
      out+=poly(`${pp(w,i+.2,wz)} ${pp(w,i+.7,wz)} ${pp(w,i+.7,wz+.75)} ${pp(w,i+.2,wz+.75)}`,'#90b8d8aa');
    }
  }
  const tz=floors*2;
  out+=poly(`${pp(0,d,tz)} ${pp(w,d,tz)} ${pp(w,0,tz)} ${pp(0,0,tz)}`,roof);
  out+=`<line x1="${iso(0,d,tz)[0]}" y1="${iso(0,d,tz)[1]}" x2="${iso(w,d,tz)[0]}" y2="${iso(w,d,tz)[1]}" stroke="#b8b0a8" stroke-width=".5"/>`;
  out+=`<line x1="${iso(w,d,tz)[0]}" y1="${iso(w,d,tz)[1]}" x2="${iso(w,0,tz)[0]}" y2="${iso(w,0,tz)[1]}" stroke="#b8b0a8" stroke-width=".5"/>`;

  const pts=[];
  [0,w].forEach(x=>[0,d].forEach(y=>[0,floors*2].forEach(z=>{const[px,py]=iso(x,y,z);pts.push([+px,+py])})));
  const minX=Math.min(...pts.map(p=>p[0]))-4,maxX=Math.max(...pts.map(p=>p[0]))+4;
  const minY=Math.min(...pts.map(p=>p[1]))-4,maxY=Math.max(...pts.map(p=>p[1]))+4;
  const vw=(maxX-minX).toFixed(0),vh=(maxY-minY).toFixed(0);
  return `<svg width="${vw}" height="${vh}" viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}

// ── FLOOR PLAN SVG ───────────────────────────────────────────────
const RC={classroom:'#dce8f8',hall:'#d8f0da',admin:'#f8f0d8',toilet:'#dce8f0',corridor:'#f0ede6',lab:'#eadcf8',dining:'#f8eada',sports:'#d8f0e0',store:'#e8e8e2'};
const RS={classroom:'#5a8ab8',hall:'#4a8a5a',admin:'#8a7a4a',toilet:'#4a7a8a',corridor:'#8a8070',lab:'#7a5a8a',dining:'#8a6a4a',sports:'#4a8a6a',store:'#606060'};

function tx(x,y,text,size=11,bold=false,col='#1a2a1a'){
  const lines=text.split('\n'),lh=size*1.35,sy=y-(lines.length-1)*lh/2;
  return lines.map((l,i)=>`<text x="${x}" y="${sy+i*lh}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" font-family="'DM Sans',sans-serif" fill="${col}" font-weight="${bold?'500':'400'}">${l}</text>`).join('');
}

function planSVG(school,active){
  return school.phase==='Primary'?primaryPlan(school,active):secondaryPlan(school,active);
}

function primaryPlan(school,active){
  const fe=school.fe,nc=fe*4;
  const bW=420+(fe-1)*100,bH=280,PAD=34,vW=bW+PAD*2,vH=bH+PAD*2+40;
  const bX=PAD,bY=PAD;
  const adminH=80,hallW=Math.round(bW*.36),corrW=30;
  const classX=bX+hallW+corrW,classAreaW=bW-hallW-corrW;
  const classW=classAreaW/2,classH=(bH-adminH)/Math.ceil(nc/2);
  const aEl=k=>active===k;

  let r='',t='',wl='',ov='';

  // Admin strip
  const adm=[{l:'Entrance',t:'admin'},{l:'Main Office',t:'admin'},{l:'Staffroom',t:'admin'},{l:'WC & Stores',t:'toilet'}];
  const adW=[Math.round(bW*.18),Math.round(bW*.25),Math.round(bW*.20),0];
  adW[3]=bW-adW[0]-adW[1]-adW[2];
  let ax=bX;
  adm.forEach((s,i)=>{
    r+=`<rect x="${ax}" y="${bY}" width="${adW[i]}" height="${adminH}" fill="${RC[s.t]}" stroke="${RS[s.t]}" stroke-width=".6"/>`;
    t+=tx(ax+adW[i]/2,bY+adminH/2,s.l,10);
    if(i>0){const lc=aEl('int-wall')?'#534ab7':'#8a8070';wl+=`<line x1="${ax}" y1="${bY}" x2="${ax}" y2="${bY+adminH}" stroke="${lc}" stroke-width="${aEl('int-wall')?2.5:1}" class="fp-iw" onclick="selEl('int-wall')">`+`</line>`;}
    ax+=adW[i];
  });

  // Hall
  r+=`<rect x="${bX}" y="${bY+adminH}" width="${hallW}" height="${bH-adminH}" fill="${RC.hall}" stroke="${RS.hall}" stroke-width=".6"/>`;
  t+=tx(bX+hallW/2,bY+adminH+(bH-adminH)/2,'School\nHall',12,true,'#1a3a1a');

  // Corridor
  r+=`<rect x="${bX+hallW}" y="${bY+adminH}" width="${corrW}" height="${bH-adminH}" fill="${RC.corridor}" stroke="${RS.corridor}" stroke-width=".6"/>`;

  // Internal walls
  const ilc=aEl('int-wall')?'#534ab7':'#6a8a6a',ilw=aEl('int-wall')?2.5:1.2;
  const iwAttr=`stroke="${ilc}" stroke-width="${ilw}" class="fp-iw" onclick="selEl('int-wall')"`;
  wl+=`<line x1="${bX+hallW}" y1="${bY+adminH}" x2="${bX+hallW}" y2="${bY+bH}" ${iwAttr}/>`
    +`<line x1="${bX+hallW+corrW}" y1="${bY+adminH}" x2="${bX+hallW+corrW}" y2="${bY+bH}" ${iwAttr}/>`
    +`<line x1="${bX}" y1="${bY+adminH}" x2="${bX+bW}" y2="${bY+adminH}" ${iwAttr}/>`;

  // Classrooms
  for(let i=0;i<nc;i++){
    const col=i%2,row=Math.floor(i/2);
    const cx=classX+col*classW,cy=bY+adminH+row*classH;
    r+=`<rect x="${cx}" y="${cy}" width="${classW}" height="${classH}" fill="${RC.classroom}" stroke="${RS.classroom}" stroke-width=".6"/>`;
    t+=tx(cx+classW/2,cy+classH/2,`Class ${i+1}`,10);
    if(col===1)wl+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy+classH}" ${iwAttr}/>`;
    if(row>0&&col===0)wl+=`<line x1="${cx}" y1="${cy}" x2="${cx+classAreaW}" y2="${cy}" ${iwAttr}/>`;
  }

  // Outer wall
  const owC=aEl('ext-wall')?'#1d9e75':'#1a3a2a',owW=aEl('ext-wall')?4:3;
  r+=`<rect x="${bX}" y="${bY}" width="${bW}" height="${bH}" fill="none" stroke="${owC}" stroke-width="${owW}" class="fp-hit" onclick="selEl('ext-wall')"/>`;

  // Windows
  const wC=aEl('window')?'#378add':'#7ab8d4',wS=aEl('window')?'#0a4a8a':'#4a8aa8';
  const winAttr=`fill="${wC}" stroke="${wS}" stroke-width=".6" class="fp-win" onclick="selEl('window')"`;
  for(let wx=bX+50;wx<bX+bW-30;wx+=75)wl+=`<rect x="${wx}" y="${bY-4}" width="22" height="8" rx="1.5" ${winAttr}/>`;
  for(let wx=bX+80;wx<bX+bW-40;wx+=90)wl+=`<rect x="${wx}" y="${bY+bH-4}" width="22" height="8" rx="1.5" ${winAttr}/>`;
  for(let wy=bY+100;wy<bY+bH-40;wy+=70)wl+=`<rect x="${bX-4}" y="${wy}" width="8" height="18" rx="1.5" ${winAttr}/>`;
  for(let wy=bY+90;wy<bY+bH-30;wy+=70)wl+=`<rect x="${bX+bW-4}" y="${wy}" width="8" height="18" rx="1.5" ${winAttr}/>`;

  // Hit zones
  const hz=18;
  [[bX-hz,bY-hz,bW+hz*2,hz],[bX-hz,bY+bH,bW+hz*2,hz],[bX-hz,bY,hz,bH],[bX+bW,bY,hz,bH]].forEach(([rx,ry,rw,rh])=>{
    ov+=`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="transparent" class="fp-hit" onclick="selEl('ext-wall')"/>`;
  });

  // Symbols
  const sy=symTags(aEl,bX,bY,bW,bH,hallW,corrW,adminH);

  // Annotations
  const ann=annotations(bX,bY,bW,bH,'~20m');

  return `<svg width="${vW}" height="${vH}" viewBox="0 0 ${vW} ${vH}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">${r}${wl}${sy}${ov}${t}${ann}</svg>`;
}

function secondaryPlan(school,active){
  const fe=school.fe;
  const bW=480+(fe-1)*80,bH=340,PAD=34,vW=bW+PAD*2,vH=bH+PAD*2+40;
  const bX=PAD,bY=PAD;
  const recH=80,mCH=32,mCY=bY+recH;
  const wingY=mCY+mCH,wingH1=Math.round((bH-recH-mCH)*.52),wingH2=bH-recH-mCH-wingH1;
  const aEl=k=>active===k;

  let r='',t='',wl='',ov='';

  // Admin top strip
  const adW=[140,120,120,bW-380];
  const adm=[{l:'Reception',t:'admin'},{l:'Headteacher\nSuite',t:'admin'},{l:'SEN / SENCO',t:'admin'},{l:'WC / Plant',t:'toilet'}];
  let ax=bX;
  adm.forEach((s,i)=>{
    r+=`<rect x="${ax}" y="${bY}" width="${adW[i]}" height="${recH}" fill="${RC[s.t]}" stroke="${RS[s.t]}" stroke-width=".6"/>`;
    t+=tx(ax+adW[i]/2,bY+recH/2,s.l,10);
    if(i>0){const lc=aEl('int-wall')?'#534ab7':'#8a8070';wl+=`<line x1="${ax}" y1="${bY}" x2="${ax}" y2="${bY+recH}" stroke="${lc}" stroke-width="${aEl('int-wall')?2.5:1}" class="fp-iw" onclick="selEl('int-wall')"/>`;}
    ax+=adW[i];
  });

  // Main corridor
  r+=`<rect x="${bX}" y="${mCY}" width="${bW}" height="${mCH}" fill="${RC.corridor}" stroke="${RS.corridor}" stroke-width=".6"/>`;
  t+=tx(bX+bW/2,mCY+mCH/2,'MAIN CORRIDOR — GROUND FLOOR',9,false,'#666');

  // Wings
  const wings=[
    [{l:'Science Lab 1',t:'lab',w:Math.round(bW/3)},{l:'Science Lab 2',t:'lab',w:Math.round(bW/3)},{l:'Art & Design\nTechnology',t:'lab',w:0}],
    [{l:'Humanities\nBlock',t:'classroom',w:Math.round(bW*.42)},{l:'Sports Hall',t:'sports',w:0}]
  ];
  wings[0][2].w=bW-wings[0][0].w-wings[0][1].w;
  wings[1][1].w=bW-wings[1][0].w;

  wings.forEach((row,ri)=>{
    const wy=wingY+ri*wingH1,wh=ri===0?wingH1:wingH2;
    let wx=bX;
    const ilc=aEl('int-wall')?'#534ab7':'#6a8a6a',ilw=aEl('int-wall')?2.5:0.8;
    row.forEach((rm,i)=>{
      r+=`<rect x="${wx}" y="${wy}" width="${rm.w}" height="${wh}" fill="${RC[rm.t]}" stroke="${RS[rm.t]}" stroke-width=".6"/>`;
      t+=tx(wx+rm.w/2,wy+wh/2,rm.l,10);
      if(i>0)wl+=`<line x1="${wx}" y1="${wy}" x2="${wx}" y2="${wy+wh}" stroke="${ilc}" stroke-width="${ilw}" class="fp-iw" onclick="selEl('int-wall')"/>`;
      wx+=rm.w;
    });
    if(ri===1)wl+=`<line x1="${bX}" y1="${wy}" x2="${bX+bW}" y2="${wy}" stroke="${aEl('int-wall')?'#534ab7':'#6a8a6a'}" stroke-width="${aEl('int-wall')?2.5:.8}" class="fp-iw" onclick="selEl('int-wall')"/>`;
  });

  const ilc2=aEl('int-wall')?'#534ab7':'#6a8a6a',ilw2=aEl('int-wall')?2.5:1.2;
  wl+=`<line x1="${bX}" y1="${bY+recH}" x2="${bX+bW}" y2="${bY+recH}" stroke="${ilc2}" stroke-width="${ilw2}" class="fp-iw" onclick="selEl('int-wall')"/>`;
  wl+=`<line x1="${bX}" y1="${wingY}" x2="${bX+bW}" y2="${wingY}" stroke="${ilc2}" stroke-width="${ilw2}" class="fp-iw" onclick="selEl('int-wall')"/>`;

  // Floor count note
  t+=`<text x="${bX+bW-6}" y="${mCY+mCH-5}" text-anchor="end" font-size="9" font-family="'DM Mono',monospace" fill="#888">${school.floors} STOREYS TOTAL</text>`;

  // Outer wall
  const owC=aEl('ext-wall')?'#1d9e75':'#1a3a2a',owW=aEl('ext-wall')?4:3;
  r+=`<rect x="${bX}" y="${bY}" width="${bW}" height="${bH}" fill="none" stroke="${owC}" stroke-width="${owW}" class="fp-hit" onclick="selEl('ext-wall')"/>`;

  // Windows
  const wC=aEl('window')?'#378add':'#7ab8d4',wS=aEl('window')?'#0a4a8a':'#4a8aa8';
  const wa=`fill="${wC}" stroke="${wS}" stroke-width=".6" class="fp-win" onclick="selEl('window')"`;
  for(let wx=bX+50;wx<bX+bW-30;wx+=80)wl+=`<rect x="${wx}" y="${bY-4}" width="22" height="8" rx="1.5" ${wa}/>`;
  for(let wx=bX+60;wx<bX+bW-40;wx+=90)wl+=`<rect x="${wx}" y="${bY+bH-4}" width="22" height="8" rx="1.5" ${wa}/>`;
  for(let wy=bY+100;wy<bY+bH-40;wy+=75)wl+=`<rect x="${bX-4}" y="${wy}" width="8" height="18" rx="1.5" ${wa}/>`;
  for(let wy=bY+90;wy<bY+bH-30;wy+=75)wl+=`<rect x="${bX+bW-4}" y="${wy}" width="8" height="18" rx="1.5" ${wa}/>`;

  // Hit zones
  const hz=18;
  [[bX-hz,bY-hz,bW+hz*2,hz],[bX-hz,bY+bH,bW+hz*2,hz],[bX-hz,bY,hz,bH],[bX+bW,bY,hz,bH]].forEach(([rx,ry,rw,rh])=>{
    ov+=`<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="transparent" class="fp-hit" onclick="selEl('ext-wall')"/>`;
  });

  const sy=symTags(aEl,bX,bY,bW,bH,0,0,wingY-bY);
  const ann=annotations(bX,bY,bW,bH,'~40m');
  return `<svg width="${vW}" height="${vH}" viewBox="0 0 ${vW} ${vH}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">${r}${wl}${sy}${ov}${t}${ann}</svg>`;
}

function symTags(aEl,bX,bY,bW,bH,hallW,corrW,adminH){
  const rBg=aEl('roof')?'#854f0b':'#ede8dc',rTx=aEl('roof')?'#faeeda':'#633806';
  const fBg=aEl('floor')?'#5f5e5a':'#e8e5e0',fTx=aEl('floor')?'#f1efe8':'#444441';
  const hBg=aEl('heating')?'#d85a30':'#f5e8dc',hTx=aEl('heating')?'#faece7':'#4a1b0c';
  return `
    <g class="fp-sym" onclick="selEl('roof')" transform="translate(${bX+bW-74},${bY+8})">
      <rect width="70" height="22" rx="4" fill="${rBg}" stroke="${aEl('roof')?'#633806':'#c8b888'}" stroke-width=".8"/>
      <text x="35" y="14.5" text-anchor="middle" font-size="9" font-family="'DM Mono',monospace" fill="${rTx}" letter-spacing=".5">▲ ROOF</text>
    </g>
    <g class="fp-sym" onclick="selEl('floor')" transform="translate(${bX+8},${bY+adminH+8})">
      <rect width="52" height="20" rx="3" fill="${fBg}" stroke="${aEl('floor')?'#2c2c2a':'#b8b0a8'}" stroke-width=".7"/>
      <text x="26" y="13.5" text-anchor="middle" font-size="8.5" font-family="'DM Mono',monospace" fill="${fTx}">FLOOR</text>
    </g>
    <g class="fp-sym" onclick="selEl('heating')" transform="translate(${bX+8},${bY+bH-32})">
      <rect width="64" height="22" rx="4" fill="${hBg}" stroke="${aEl('heating')?'#993c1d':'#d88858'}" stroke-width=".8"/>
      <text x="32" y="14.5" text-anchor="middle" font-size="9" font-family="'DM Mono',monospace" fill="${hTx}" letter-spacing=".2">≋ HVAC</text>
    </g>`;
}

function annotations(bX,bY,bW,bH,scale){
  return `
    <text x="${bX}" y="${bY-11}" font-size="9" font-family="'DM Mono',monospace" fill="#999" letter-spacing=".5">GROUND FLOOR PLAN — SCHEMATIC (illustrative, not to scale)</text>
    <g transform="translate(${bX},${bY+bH+16})">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#bbb" stroke-width=".8"/>
      <text x="9" y="13" text-anchor="middle" font-size="9" font-family="'DM Mono',monospace" fill="#999">N</text>
      <line x1="9" y1="2" x2="9" y2="7" stroke="#999" stroke-width="1.5"/>
    </g>
    <g transform="translate(${bX+30},${bY+bH+14})">
      <line x1="0" y1="10" x2="50" y2="10" stroke="#bbb" stroke-width="1"/>
      <line x1="0" y1="7" x2="0" y2="13" stroke="#bbb" stroke-width="1"/>
      <line x1="50" y1="7" x2="50" y2="13" stroke="#bbb" stroke-width="1"/>
      <text x="25" y="25" text-anchor="middle" font-size="8.5" font-family="'DM Mono',monospace" fill="#999">${scale}</text>
    </g>`;
}

// ── PROPERTIES PANEL ─────────────────────────────────────────────
function condBadge(c){
  const m={'A':['A — Excellent','ca'],'B':['B — Good','cb'],'C':['C — Fair','cc'],'D':['D — Poor','cd'],'E':['E — Critical','ce']};
  const[l,cls]=m[c]||[c,'cc'];
  return `<span class="cbadge ${cls}">${l}</span>`;
}

function selEl(key){
  if(!currentSchool)return;
  currentEl=key;
  document.querySelectorAll('.el-chip').forEach(c=>c.classList.toggle('on',c.dataset.key===key));
  const fpDiv=document.getElementById('fp-svg');
  if(fpDiv)fpDiv.innerHTML=planSVG(currentSchool,key);
  const props=getProps(key,currentSchool);
  const el=ELEMENTS.find(e=>e.key===key);
  if(!props||!el)return;
  document.getElementById('pr-hdr-tag').textContent='Element Properties';
  document.getElementById('pr-hdr-name').textContent=props.name;
  const empty=document.getElementById('pr-empty');
  const body=document.getElementById('pr-body');
  if(empty)empty.style.display='none';
  if(body){
    body.style.display='block';
    const uc=props.urgency==='urgent'?'act-urgent':props.urgency==='ok'?'act-ok':'act-warn';
    body.innerHTML=props.rows.map(row=>`
      <div class="pr-row">
        <div class="pr-lbl">${row.l}</div>
        <div class="pr-val">${row.cond?condBadge(row.cond):row.v}</div>
        ${row.s?`<div class="pr-sub">${row.s}</div>`:''}
      </div>`).join('')+`
      <div class="pr-row">
        <div class="pr-lbl">Recommended Action</div>
        <div class="act-box ${uc}">${props.action}</div>
      </div>`;
  }
}

// ── RENDER INDEX ─────────────────────────────────────────────────
function renderIndex(){
  document.getElementById('back-btn').style.display='none';
  document.getElementById('root').innerHTML=`
    <div class="idx-hero">
      <div class="idx-tag">BSI Interactive School Explorer</div>
      <h1 class="idx-title">Your school, in spatial intelligence</h1>
      <p class="idx-sub">Select your school type below — or scan the QR code on your Lego kit — to explore a clickable floor plan showing live condition data, thermal performance, and recommended actions for every building element.</p>
    </div>
    <div class="s-grid">
      ${Object.values(SCHOOLS).map(s=>`
        <div class="s-card">
          <div class="s-card-top">
            <div>
              <div class="s-phase-tag" style="background:${s.phaseBg};color:${s.phaseText}">${s.phase}</div>
              <div class="s-name">${s.fe} Form${s.fe>1?'s':''} of Entry</div>
              <div class="s-desc">${s.desc}</div>
            </div>
            <div class="s-iso">${isoSVG(s.iso)}</div>
          </div>
          <div class="s-stats">
            <div class="s-stat"><div class="s-stat-lbl">Pupils</div><div class="s-stat-val">${s.pupils}</div></div>
            <div class="s-stat"><div class="s-stat-lbl">Classrooms</div><div class="s-stat-val">${s.classrooms}</div></div>
            <div class="s-stat"><div class="s-stat-lbl">Est. area</div><div class="s-stat-val">${s.grossArea}</div></div>
            <div class="s-stat"><div class="s-stat-lbl">Build era</div><div class="s-stat-val">${s.buildEra}</div></div>
            <div class="s-stat"><div class="s-stat-lbl">Floors</div><div class="s-stat-val">${s.floors}</div></div>
            <div class="s-stat"><div class="s-stat-lbl">Lego bricks</div><div class="s-stat-val">${s.legoCount}</div></div>
          </div>
          <div class="s-qr">
            <canvas id="qr-${s.key}" width="72" height="72" style="border-radius:4px;flex-shrink:0;border:.5px solid #eee"></canvas>
            <div class="s-qr-info">
              <div class="s-qr-lbl">Scan to open</div>
              <div class="s-qr-url">${BASE}?school=${s.key}</div>
            </div>
          </div>
          <button class="s-btn" onclick="renderDemo('${s.key}')">Open interactive demo →</button>

      }
    });
  },150);
}

// ── RENDER DEMO ──────────────────────────────────────────────────

  document.getElementById('root').innerHTML=`
    <div class="demo-wrap">
      <div class="plan-col">
        <div class="demo-bar">
          <div class="demo-bar-name">${currentSchool.label}</div>
          <div class="demo-bar-sub">${currentSchool.desc} · ${currentSchool.floors} storey${currentSchool.floors>1?'s':''} · ${currentSchool.grossArea} gross · Built ${currentSchool.buildEra}</div>
        </div>
        <div class="el-chips">
          ${ELEMENTS.map(e=>`<button class="el-chip" data-key="${e.key}" onclick="selEl('${e.key}')">

        <div class="plan-canvas">
          <div id="fp-svg">${planSVG(currentSchool,null)}</div>
        </div>

      <div class="props-col">

        <div class="pr-empty" id="pr-empty">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" opacity=".3">
            <rect x="4" y="4" width="28" height="28" rx="3" stroke="#888" stroke-width="1.5"/>
            <line x1="4" y1="12" x2="32" y2="12" stroke="#888" stroke-width="1"/>

// ── INIT ─────────────────────────────────────────────────────────
renderIndex();
</script>
